services:
  spotiscan-backend:
    build: backend/
    image: ghcr.io/chivta/spotiscan-backend:latest
    ports:
      - "${PORT}:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  spotiscan-frontend:
    build: frontend/
    image: ghcr.io/chivta/spotiscan-frontend:latest
    env_file:
      - .env
    volumes:
      - ./frontend/dist:/app/dist
    restart: unless-stopped