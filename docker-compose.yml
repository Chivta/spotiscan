services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ruscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app          # dev-only
      - backend_tmp:/app/tmp
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux only; Mac/Windows have this built-in
    environment:
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - DB_URL=postgres://postgres:postgres@postgres:5432/ruscan?sslmode=disable
      - RABBITMQ_URL=amqp://rabbitmq:rabbitmq@rabbitmq:5672/
      - SPOTIFY_QUEUE=spotify_queue
      - SECURE_COOKIES=false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scan-worker:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.scan-worker
      target: dev
    volumes:
      - ./backend:/app
      - scan_worker_tmp:/app/tmp
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://postgres:postgres@postgres:5432/ruscan?sslmode=disable
      - RABBITMQ_URL=amqp://rabbitmq:rabbitmq@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy # ensures DB migrations have run before worker starts

  spotify-gateway:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.spotify-gateway
      target: dev
    volumes:
      - ./backend:/app
      - spotify_gateway_tmp:/app/tmp
    env_file:
      - ./backend/.env
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:rabbitmq@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  scraper:
    restart: no
    profiles:
      - scraper
    build:
      context: ./backend
      target: scraper
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://postgres:postgres@postgres:5432/ruscan?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy # scraper needs backend to be healthy to ensure DB migrations have run
      redis:
        condition: service_started # to load new artists into cache after update

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  backend_tmp:
  scan_worker_tmp:
  spotify_gateway_tmp:
  frontend_node_modules:
  redis_data:
  rabbitmq-lib:
  rabbitmq-log:
