services:
  spotiscan-backend:
    build: backend/
    image: ghcr.io/chivta/spotiscan-backend:latest
    ports:
      - "${PORT}:8080"
    environment:
      - PORT
      - ENV
      - DB_URL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  spotiscan-frontend:
    build: frontend/
    image: ghcr.io/chivta/spotiscan-frontend:latest
    volumes:
      - frontend-dist:/build/dist
    restart: unless-stopped

volumes:
  frontend-dist:
