version: '3.8'

services:
  spotiscan-backend:
    build: backend/
    image: ghcr.io/chivta/spotiscan-backend:latest
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENV=development
      # DB_URL will be injected at runtime on VPS
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  spotiscan-frontend:
    build: frontend/
    image: ghcr.io/chivta/spotiscan-frontend:latest
    restart: unless-stopped

# Optional volume for local dev; not required in CI/CD
volumes:
  frontend-dist:
