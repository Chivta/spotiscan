services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotiscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotiscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app          # dev-only
      - backend_tmp:/app/tmp
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux only; Mac/Windows have this built-in
    environment:
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - DB_URL=postgres://postgres:postgres@postgres:5432/spotiscan?sslmode=disable
      - SECURE_COOKIES=false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scraper:
    profiles:
      - scraper
    build:
      context: ./backend
      target: scraper
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_URL=postgres://postgres:postgres@postgres:5432/spotiscan?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy # scraper needs backend to be healthy to ensure DB migrations have run
      redis:
        condition: service_started # to load new artists into cache after update

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  backend_tmp:
  frontend_node_modules:
  redis_data:
