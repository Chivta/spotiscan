services:
  spotiscan-backend:
    image: ghcr.io/chivta/spotiscan-backend:latest
    build: backend/
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENV=development
      - DB_URL=${DB_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  spotiscan-frontend:
    image: ghcr.io/chivta/spotiscan-frontend:latest
    build: frontend/
    volumes:
      - frontend-dist:/build/dist
    restart: unless-stopped
