services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spotiscan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotiscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app          # dev-only: includes bot_data.db (triggers SQLite migration on startup)
      - backend_tmp:/app/tmp
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux only; Mac/Windows have this built-in
    environment:
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - DB_URL=postgres://postgres:postgres@postgres:5432/spotiscan?sslmode=disable
      - SECURE_COOKIES=false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  backend_tmp:
  frontend_node_modules:
  redis_data:
