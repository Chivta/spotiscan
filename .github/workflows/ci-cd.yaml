name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: ./backend

      - name: Run tests
        run: go test -v -race ${{ github.event_name == 'push' && '-coverprofile=coverage.out' || '' }} ./...
        working-directory: ./backend

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.out
          flags: unittests
          fail_ci_if_error: false

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build (type-check + bundling)
        run: npm run build
        working-directory: ./frontend

  build-and-push:
    needs: [test, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_built: ${{ steps.changed.outputs.backend }}
      frontend_built: ${{ steps.changed.outputs.frontend }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          # On initial push to a branch, before is all zeros — build everything
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: steps.changed.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/spotiscan-backend:latest
            ghcr.io/${{ github.repository }}/spotiscan-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        if: steps.changed.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/spotiscan-frontend:latest
            ghcr.io/${{ github.repository }}/spotiscan-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only run when at least one image was actually rebuilt
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.build-and-push.outputs.backend_built == 'true' ||
       needs.build-and-push.outputs.frontend_built == 'true')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags in kustomization.yaml
        working-directory: ./k8s
        run: |
          if [ "${{ needs.build-and-push.outputs.backend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/spotiscan-backend=ghcr.io/${{ github.repository }}/spotiscan-backend:${{ needs.build-and-push.outputs.tag }}
          fi
          if [ "${{ needs.build-and-push.outputs.frontend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/spotiscan-frontend=ghcr.io/${{ github.repository }}/spotiscan-frontend:${{ needs.build-and-push.outputs.tag }}
          fi

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: update images to ${{ github.sha }}"
          git push
