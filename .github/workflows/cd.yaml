name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_built: ${{ steps.changed.outputs.backend }}
      frontend_built: ${{ steps.changed.outputs.frontend }}
      tag: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect changed paths
        id: changed
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          BEFORE=$(grep -m1 'newTag:' k8s/kustomization.yaml | awk '{print $2}' || echo "")
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$SHA" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: steps.changed.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ruscan-backend:latest
            ghcr.io/${{ github.repository }}/ruscan-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push scraper
        if: steps.changed.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: scraper
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ruscan-scraper:latest
            ghcr.io/${{ github.repository }}/ruscan-scraper:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,scope=scraper,mode=max

      - name: Build and push frontend
        if: steps.changed.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ruscan-frontend:latest
            ghcr.io/${{ github.repository }}/ruscan-frontend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: |
      needs.build-and-push.outputs.backend_built == 'true' ||
      needs.build-and-push.outputs.frontend_built == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags in kustomization.yaml
        working-directory: ./k8s
        run: |
          if [ "${{ needs.build-and-push.outputs.backend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/ruscan-backend=ghcr.io/${{ github.repository }}/ruscan-backend:${{ needs.build-and-push.outputs.tag }}
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/ruscan-scraper=ghcr.io/${{ github.repository }}/ruscan-scraper:${{ needs.build-and-push.outputs.tag }}
          fi
          if [ "${{ needs.build-and-push.outputs.frontend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/ruscan-frontend=ghcr.io/${{ github.repository }}/ruscan-frontend:${{ needs.build-and-push.outputs.tag }}
          fi

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: update images to ${{ needs.build-and-push.outputs.tag }}"
          git push origin HEAD:main
