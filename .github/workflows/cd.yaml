name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      backend_built: ${{ steps.changes.outputs.backend }}
      frontend_built: ${{ steps.changes.outputs.frontend }}
      tag: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed paths
        id: changes
        # Read changed against latest tag in kustomization.yaml
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          BACKEND_BEFORE=$(grep -A2 'name: ghcr.io/chivta/ruscan/api' k8s/kustomization.yaml | grep -oP '(?<=newTag: )\S+' || echo "")
          FRONTEND_BEFORE=$(grep -A2 'name: ghcr.io/chivta/ruscan/frontend' k8s/kustomization.yaml | grep -oP '(?<=newTag: )\S+' || echo "")
          if [ -z "$BACKEND_BEFORE" ] || [ "$BACKEND_BEFORE" = "$SHA" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$FRONTEND_BEFORE" ] || [ "$FRONTEND_BEFORE" = "$SHA" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BACKEND_BEFORE" "$SHA" | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$FRONTEND_BEFORE" "$SHA" | grep -q '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        name: Build and push api
        if: steps.changes.outputs.backend == 'true'
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - uses: docker/build-push-action@v6
        name: Build and push scraper
        if: steps.changes.outputs.backend == 'true'
        with:
          context: ./backend
          file: ./backend/Dockerfile.scraper
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/scraper:latest
            ghcr.io/${{ github.repository }}/scraper:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=scraper
          cache-to: type=gha,scope=scraper,mode=max

      - uses: docker/build-push-action@v6
        name: Build and push spotify-gateway
        if: steps.changes.outputs.backend == 'true'
        with:
          context: ./backend
          file: ./backend/Dockerfile.spotify-gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/spotify-gateway:latest
            ghcr.io/${{ github.repository }}/spotify-gateway:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=spotify-gateway
          cache-to: type=gha,scope=spotify-gateway,mode=max

      - uses: docker/build-push-action@v6
        name: Build and push scan-worker
        if: steps.changes.outputs.backend == 'true'
        with:
          context: ./backend
          file: ./backend/Dockerfile.scan-worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/scan-worker:latest
            ghcr.io/${{ github.repository }}/scan-worker:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

          cache-from: type=gha,scope=scan-worker
          cache-to: type=gha,scope=scan-worker,mode=max

      - uses: docker/build-push-action@v6
        name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: | 
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    permissions:
      contents: write
    
    runs-on: ubuntu-latest

    # Check if anything was built
    if: ${{ needs.build-and-push.outputs.backend_built == 'true' || needs.build-and-push.outputs.frontend_built == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update tags in kustomization.yaml
        working-directory: ./k8s
        run: |
          if [ "${{ needs.build-and-push.outputs.backend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/api=ghcr.io/${{ github.repository }}/api:${{ needs.build-and-push.outputs.tag }}
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/scraper=ghcr.io/${{ github.repository }}/scraper:${{ needs.build-and-push.outputs.tag }}
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/spotify-gateway=ghcr.io/${{ github.repository }}/spotify-gateway:${{ needs.build-and-push.outputs.tag }}
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/scan-worker=ghcr.io/${{ github.repository }}/scan-worker:${{ needs.build-and-push.outputs.tag }}
          fi
          if [ "${{ needs.build-and-push.outputs.frontend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/${{ github.repository }}/frontend=ghcr.io/${{ github.repository }}/frontend:${{ needs.build-and-push.outputs.tag }}
          fi  

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: update images to ${{ needs.build-and-push.outputs.tag }}"
          git push origin HEAD:main