name: Docker Compose CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Docker Compose CLI plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build all services
      - name: Build Docker Compose services
        run: docker compose -f docker-compose.yml build

      # Tag images for GHCR
      - name: Tag backend image
        run: docker tag ${PWD##*/}_spotiscan-backend:latest ghcr.io/${{ github.repository_owner }}/spotiscan-backend:latest

      - name: Tag frontend image
        run: docker tag ${PWD##*/}_spotiscan-frontend:latest ghcr.io/${{ github.repository_owner }}/spotiscan-frontend:latest

      # Push images to GHCR
      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/spotiscan-backend:latest

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/spotiscan-frontend:latest
