name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Save images to tar files
        run: |
          docker save -o backend.tar ghcr.io/chivta/spotiscan-backend:latest
          docker save -o frontend.tar ghcr.io/chivta/spotiscan-frontend:latest

      - name: Copy images and compose file to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend.tar,frontend.tar,docker-compose.yml"
          target: "/home/${{ secrets.VPS_USER }}/app"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/app
            docker load -i backend.tar
            docker load -i frontend.tar
            docker compose up -d --force-recreate
            docker system prune -f
            rm backend.tar frontend.tar