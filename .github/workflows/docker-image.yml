name: Docker Compose CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Set up Docker Buildx (includes modern docker compose CLI)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using a Personal Access Token (PAT) stored as secret GHCR_PAT
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # Build all services defined in docker-compose.yml
      - name: Build Docker Compose services
        run: docker compose -f docker-compose.yml build

      # Push backend image to GHCR
      - name: Push backend image
        run: docker compose -f docker-compose.yml push spotiscan-backend

      # Push frontend image to GHCR
      - name: Push frontend image
        run: docker compose -f docker-compose.yml push spotiscan-frontend
