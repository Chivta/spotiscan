apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: spotiscan
  labels:
    app: frontend-app
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      containers:
        - name: frontend-app
          image: ghcr.io/chivta/spotiscan/spotiscan-frontend:latest
          ports:
            - containerPort: 80
      imagePullSecrets:
        - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: spotiscan
  labels:
    app: frontend-app
spec:
  selector:
    app: frontend-app
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP