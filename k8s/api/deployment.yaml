apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ruscan
  labels:
    app: api
spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/chivta/ruscan/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: GIN_MODE
              value: release
            - name: SECURE_COOKIES
              value: "true"
            - name: REDIS_URL
              value: redis://redis-svc:6379
            - name: POSTGRES_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3