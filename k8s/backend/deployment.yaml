apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend 
  namespace: spotiscan
  labels:
    app: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: 
    matchLabels:
      app: backend 
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/chivta/spotiscan/spotiscan-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: GIN_MODE
              value: "release"
            - name: SECURE_COOKIES
              value: "true"
            - name: REDIS_URL
              value: "redis://redis-svc:6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: spotiscan
  labels:
    app: backend
spec:
  selector:
    app: backend  
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP