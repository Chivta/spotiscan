apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-worker
  namespace: ruscan
  labels:
    app: scan-worker
spec:
  selector:
    matchLabels:
      app: scan-worker
  template:
    metadata:
      labels:
        app: scan-worker
    spec:
      containers:
        - name: scan-worker
          image: ghcr.io/chivta/ruscan/scan-worker:latest
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
          env:
            - name: REDIS_URL
              value: redis://redis-svc:6379
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
      imagePullSecrets:
      - name: ghcr-secret